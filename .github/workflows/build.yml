name: Build CHARCHA APK
on:
  push:
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'
      - name: Unzip project
        run: for f in *.zip; do unzip -o -q "$f"; done
      - name: Build APK
        working-directory: Charcha
        run: gradle assembleRelease --no-daemon --stacktrace
      - uses: actions/upload-artifact@v4
        with:
          name: CHARCHA-APK
          path: Charcha/app/build/outputs/apk/release/app-release.apk
